name: Refresh public projects

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/update_profile.py
      - tests/test_profile.py
      - .github/workflows/profile.yml

permissions:
  contents: read

concurrency:
  group: public-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test public data handling
        run: python3 -m unittest discover -s tests -v
      - name: Refresh catalog and modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Publish changed public metadata
        run: |
          git add README.md assets/modules.svg
          if git diff --cached --quiet; then
            echo "Public projects are already up to date."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: refresh public project catalog'
          git push origin HEAD:main

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Joacoorandom</title>
  <desc id="desc">Apps, web y game tech. Portada oscura con detalles violetas y un mando dibujado con líneas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121526"/>
      <stop offset="1" stop-color="#0c101a"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8b5cf6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 H 0 V 36" fill="none" stroke="#a5b4fc" stroke-opacity=".045"/>
    </pattern>
    <linearGradient id="accent">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <ellipse cx="975" cy="140" rx="300" ry="220" fill="url(#glow)"/>
  <path d="M 42 76 V 42 H 76 M 1124 258 H 1158 V 224" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".65"/>
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="72" y="87" font-size="13" font-weight="600" letter-spacing="4" fill="#a78bfa">PLAYER / BUILDER</text>
    <text x="68" y="158" font-size="61" font-weight="750" letter-spacing="-2" fill="#f0f3ff">Joacoorandom<tspan fill="#a78bfa">.</tspan></text>
    <text x="72" y="201" font-size="19" letter-spacing="1" fill="#aab2ca">APPS <tspan fill="#626d8d">/</tspan> WEB <tspan fill="#626d8d">/</tspan> GAME TECH</text>
    <rect x="72" y="224" width="40" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="126" y="231" font-size="12" letter-spacing="1" fill="#7884a2">CREATE. PLAY. ITERATE.</text>
  </g>
  <g transform="translate(888 85)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-22" y="-26" width="216" height="182" rx="30" stroke="#a78bfa" stroke-opacity=".08"/>
    <rect x="-6" y="-10" width="184" height="150" rx="26" stroke="#a78bfa" stroke-opacity=".12"/>
    <path d="M44 30 H125 C145 30 151 44 156 65 L168 110 C172 130 152 142 139 127 L116 103 H53 L29 127 C14 143 -5 129 0 109 L12 65 C17 43 23 30 44 30 Z" fill="#171d32" stroke="#a78bfa" stroke-width="2.5"/>
    <path d="M37 60 V84 M25 72 H49" stroke="#c4b5fd" stroke-width="6"/>
    <circle cx="127" cy="62" r="5" fill="#67e8f9" stroke="none"/>
    <circle cx="143" cy="78" r="5" fill="#a78bfa" stroke="none"/>
    <circle cx="111" cy="78" r="5" fill="#a78bfa" stroke="none"/>
    <circle cx="127" cy="94" r="5" fill="#67e8f9" stroke="none"/>
    <path d="M73 68 H80 M91 68 H98" stroke="#647295" stroke-width="3"/>
    <path d="M79 30 V18 Q79 6 91 6 H112" stroke="#647295" stroke-width="2"/>
